name: Auto-merge work branches

# Every push to a work branch (any branch but main) is squashed into main,
# once the result passes the tests and builds; then the branch is deleted and
# the deploy/build of this repo is started.
on:
  push:
    branches-ignore: ["main", "gh-pages"]

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    # not in a fork: there a branch is someone's contribution, waiting for a
    # pull request, and merging it into the fork's main would delete it
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Squash the branch into main
        run: |
          # the owner, taken from the first commit of main
          OWNER_NAME=$(git log --reverse --format=%an | head -n1)
          OWNER_EMAIL=$(git log --reverse --format=%ae | head -n1)
          git config user.name "$OWNER_NAME"
          git config user.email "$OWNER_EMAIL"
          git fetch origin "$BRANCH"
          # one short line (55 characters at most), never a trailer
          msg=$(git log -1 --format=%s "origin/$BRANCH" | sed -E 's/[[:space:]]+$//' | cut -c1-55)
          git merge --squash "origin/$BRANCH"
          if git diff --cached --quiet; then
            echo "Nothing new to merge"
          else
            git commit -m "$msg" --author="$OWNER_NAME <$OWNER_EMAIL>"
            echo "MERGED=1" >> "$GITHUB_ENV"
          fi

      # what goes into main (and into a release) has to pass the tests and
      # build first; if it doesn't, main and the branch stay as they are
      - uses: actions/setup-node@v6
        if: env.MERGED == '1'
        with:
          node-version: 22
          cache: npm
      - name: Test the result
        if: env.MERGED == '1'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm test
          npm run build

      - name: Push to main
        if: env.MERGED == '1'
        run: git push origin HEAD:main

      - name: Delete the branch
        run: git push origin --delete "$BRANCH" || true

      - name: Start the deploy / build
        run: |
          if [ "${{ github.repository }}" = "havihub/HaviHub" ]; then
            gh workflow run release.yml --ref main --repo "${{ github.repository }}"
          else
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed (Pages may build from the push already)"
          fi
